<!--
  ct-registry 检索工作台 (config-driven, based on ct-base/workbench.template.html)
  -------------------------------------------------------------------------------
  本文件为本地 Web 操作界面 (由 server.py 提供 /api/* 并直连 ct_registry.py)。
  强制约定(workbench_ui.md §0/§4/§5):
    · 样式走共享 tokens.css 的 --wb-* 令牌 (data-brand=clinical-indigo), 禁止裸色值
    · 图标一律内联 SVG, 禁止 emoji
    · 双语走 I18N 引擎 (zh/en 键全对齐), JS 内禁止硬编码中文
    · 渲染单向 (铁律 9): wbRefreshAll 统一调度, 渲染函数互不调用
    · 单一主按钮 #wb-main-btn 标签自适应 (§5.3)
-->

<title>ct-registry 检索工作台</title>
<style id="wb-inline-tokens">
/* =============================================================================
 * ct-base · 工作台统一设计令牌 (Design Tokens)
 * -----------------------------------------------------------------------------
 * 全家族工作台**强制共享**的 CSS 自定义属性。规则（详见 ct-base/references/workbench_ui.md §3）：
 *   1. 结构令牌（--wb-* 前缀）名称与取值**全家族一致**，禁止各技能自造别名
 *      （旧实现混用 --brand / --accent / --navy 属违规，须迁移到 --wb-brand 等）。
 *   2. 品牌识别只通过「品牌预设」覆盖 --wb-brand / --wb-brand-2 / --wb-brand-soft
 *      三个变量；结构令牌（间距/圆角/字体/阴影/状态色/底纹）一律不改。
 *   3. 预设由 <html data-brand="..."> 选择；未设时回退 clinical-blue。
 *   4. 禁止 emoji 当图标/文案（含状态文案），图标一律内联 SVG，状态用色块+文字。
 * ========================================================================== */

/* ---- 结构令牌：所有技能一致（勿改） ---- */
:root{
  /* 字体 */
  --wb-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
             "PingFang SC", "Microsoft YaHei", sans-serif;
  --wb-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* 圆角 */
  --wb-radius:    14px;
  --wb-radius-sm: 10px;
  --wb-radius-lg: 20px;
  --wb-radius-pill: 999px;

  /* 间距 */
  --wb-gap:   16px;
  --wb-pad:   20px;
  --wb-pad-sm:12px;

  /* 阴影 */
  --wb-shadow:   0 6px 24px rgba(15,23,42,.08);
  --wb-shadow-sm:0 2px 8px  rgba(15,23,42,.06);

  /* 状态语义色（与业务品牌解耦，全家族统一） */
  --wb-ok:   #059669;
  --wb-warn: #d97706;
  --wb-err:  #dc2626;
  --wb-ok-bg:   #ecfdf5;
  --wb-warn-bg: #fffbeb;
  --wb-err-bg:  #fef2f2;

  /* 中性文本/底纹（可被品牌预设微调） */
  --wb-ink:  #0f172a;
  --wb-sub:  #5b6776;
  --wb-muted:#94a2b0;
  --wb-bg:   #f5f8fc;
  --wb-panel:#ffffff;
  --wb-line: #e4e9f0;
  --wb-line-soft:#eef2f7;
  --wb-row-hover:#eff6ff;          /* 列表行 hover / 选中底纹（组件用） */
  --wb-row-sel:  #eff6ff;
  --wb-bg-2:     #eef3fa;          /* 分区/渐变用：比 --wb-bg 深一档的页面背景 */
  --wb-row-alt:  #f6f9fd;          /* 列表斑马纹：交替行底色 */
  --wb-topbar-bg:linear-gradient(90deg, var(--wb-brand), var(--wb-brand-2)); /* 顶栏品牌渐变实心条 */
  --wb-topbar-ink:#ffffff;          /* 顶栏标题/图标色 */
  --wb-topbar-sub:rgba(255,255,255,.82); /* 顶栏副标题色 */
  --wb-on-topbar:#ffffff;           /* 顶栏上控件（按钮/语言/状态）文字·图标·边框色 */

  /* 品牌三连（默认 clinical-blue，由 data-brand 覆盖） */
  --wb-brand:      #2563eb;
  --wb-brand-2:    #0ea5e9;
  --wb-brand-soft: #eff6ff;

  /* 品牌衍生（由 --wb-brand 自动算，一般无需覆盖） */
  --wb-brand-ink:  var(--wb-brand);
  --wb-on-brand:   #ffffff;
}

/* ---- 品牌预设：仅改 --wb-brand / -2 / -soft / 少量中性色 ---- */
:root[data-brand="clinical-blue"]{
  --wb-brand:#2563eb; --wb-brand-2:#0ea5e9; --wb-brand-soft:#eff6ff;
  --wb-bg:#f5f8fc; --wb-panel:#ffffff; --wb-line:#e4e9f0; --wb-ink:#0f172a; --wb-sub:#5b6776;
}
:root[data-brand="clinical-indigo"]{   /* ct-advisor 既有蓝玻璃风，统一到 wb- 体系 */
  --wb-brand:#1C6DD0; --wb-brand-2:#5B9BD5; --wb-brand-soft:#eef1fb;
  --wb-bg:#eef1fb; --wb-bg-2:#e3e9f6; --wb-panel:rgba(255,255,255,.92);
  --wb-line:rgba(28,109,208,.20); --wb-ink:#0f2535; --wb-sub:#5a7184;
}
:root[data-brand="academic-navy"]{     /* ct-literature 学术藏青+金 */
  --wb-brand:#1c3a5c; --wb-brand-2:#4a7fb5; --wb-brand-soft:#eef4fa;
  --wb-bg:#eef2f7; --wb-panel:#ffffff; --wb-line:#dbe3ec; --wb-ink:#1a2430; --wb-sub:#6b7a8a;
  --wb-accent-gold:#a8843c;            /* 学术强调色，仅 literature 用 */
}
:root[data-brand="clinical-teal"]{
  --wb-brand:#0e7490; --wb-brand-2:#06b6d4; --wb-brand-soft:#e6f3f7;
  --wb-bg:#f2f7f8; --wb-panel:#ffffff; --wb-line:#dce8ea; --wb-ink:#0f2a30; --wb-sub:#557079;
}

/* ---- 深主题（可选，主色不变，仅底纹反转） ---- */
:root[data-theme="dark"]{
  --wb-bg:#0f172a; --wb-bg-2:#0b1220; --wb-panel:#16213a; --wb-line:#26334d;
  --wb-ink:#e7edf6; --wb-sub:#9fb0c3; --wb-muted:#64748b;
  --wb-shadow:0 6px 24px rgba(0,0,0,.35); --wb-shadow-sm:0 2px 8px rgba(0,0,0,.28);
  --wb-ok-bg:#06281d; --wb-warn-bg:#2a1f06; --wb-err-bg:#2a0f0f;
  --wb-bg-2:#0b1220; --wb-row-alt:#13203a;
  --wb-topbar-bg:linear-gradient(90deg, var(--wb-brand), var(--wb-brand-2));
  --wb-topbar-ink:#ffffff; --wb-topbar-sub:rgba(255,255,255,.8); --wb-on-topbar:#ffffff;
}

/* ---- 基础排版（所有工作台继承，禁止各技能重定义 body 背景/字体裸值） ---- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--wb-font); color:var(--wb-ink); background:var(--wb-bg);
  line-height:1.6; min-height:100vh; -webkit-tap-highlight-color:transparent;
}

</style>

<style>
  /* ===== 布局骨架：仅用结构令牌, 品牌色一律 var(--wb-brand*) ===== */
  .wb-topbar{display:flex; align-items:center; gap:14px; padding:12px var(--wb-pad);
    background:var(--wb-topbar-bg); color:var(--wb-topbar-ink);
    border-bottom:1px solid rgba(255,255,255,.12); box-shadow:var(--wb-shadow-sm);
    position:sticky; top:0; z-index:30}
  .wb-brand{display:flex; align-items:center; gap:12px; min-width:0}
  .wb-brand svg{width:34px; height:34px; flex:0 0 auto}
  .wb-brand h1{font-size:16px; margin:0; font-weight:700; color:var(--wb-topbar-ink); white-space:nowrap}
  .wb-brand .wb-sub{font-size:11px; color:var(--wb-topbar-sub); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wb-spacer{flex:1}
  .wb-top-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .wb-btn{background:var(--wb-panel); color:var(--wb-ink); border:1px solid var(--wb-line);
    border-radius:var(--wb-radius-sm); padding:8px 12px; font-size:13px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; min-height:40px; transition:.15s; font-family:inherit}
  .wb-btn:hover{border-color:var(--wb-brand); color:var(--wb-brand)}
  .wb-btn.primary{background:var(--wb-brand); color:var(--wb-on-brand); border-color:var(--wb-brand)}
  .wb-btn.primary:hover{filter:brightness(1.05); color:var(--wb-on-brand)}
  .wb-btn:active{transform:translateY(1px) scale(.985)}
  .wb-btn.primary:disabled{opacity:.6; cursor:wait}
  .wb-lang{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--wb-line);
    border-radius:var(--wb-radius-sm); background:var(--wb-panel); color:var(--wb-sub);
    cursor:pointer; min-height:40px; padding:8px 12px; font-family:inherit; font-size:13px; transition:.15s}
  .wb-lang:hover{border-color:var(--wb-brand); color:var(--wb-brand)}
  .wb-lang .sep{color:var(--wb-muted)} .wb-lang .on{color:var(--wb-brand); font-weight:700}
  .wb-topbar .wb-btn{background:transparent; color:var(--wb-on-topbar); border-color:rgba(255,255,255,.5)}
  .wb-topbar .wb-btn:hover{border-color:#fff; color:#fff; background:rgba(255,255,255,.14)}
  .wb-topbar .wb-lang{background:transparent; color:var(--wb-on-topbar); border-color:rgba(255,255,255,.5)}
  .wb-topbar .wb-lang:hover{border-color:#fff; color:#fff}
  .wb-topbar .wb-lang .sep{color:rgba(255,255,255,.55)} .wb-topbar .wb-lang .on{color:#fff}
  .wb-topbar .wb-pill{background:transparent; color:var(--wb-on-topbar); border-color:rgba(255,255,255,.5)}
  .wb-topbar .wb-pill .dot{background:rgba(255,255,255,.7)}
  .wb-topbar .wb-pill.ok{background:rgba(5,150,105,.18); border-color:#fff; color:#fff}
  .wb-topbar .wb-pill.warn{background:rgba(217,119,6,.18); border-color:#fff; color:#fff}
  .wb-topbar .wb-pill.err{background:rgba(220,38,38,.20); border-color:#fff; color:#fff}
  .wb-pill{font-size:12px; font-weight:600; border-radius:var(--wb-radius-pill); padding:5px 12px;
    border:1px solid var(--wb-line); background:var(--wb-panel); color:var(--wb-sub); white-space:nowrap;
    display:inline-flex; align-items:center; gap:6px}
  .wb-pill .dot{width:8px; height:8px; border-radius:50%; background:var(--wb-muted)}
  .wb-pill.ok{background:var(--wb-ok-bg); border-color:var(--wb-ok); color:var(--wb-ok)} .wb-pill.ok .dot{background:var(--wb-ok)}
  .wb-pill.warn{background:var(--wb-warn-bg); border-color:var(--wb-warn); color:var(--wb-warn)} .wb-pill.warn .dot{background:var(--wb-warn)}
  .wb-pill.err{background:var(--wb-err-bg); border-color:var(--wb-err); color:var(--wb-err)} .wb-pill.err .dot{background:var(--wb-err)}

  .wb-main{max-width:1280px; margin:0 auto; padding:var(--wb-pad); display:grid; gap:var(--wb-gap);
    grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-areas:"input result" "thread history"}
  #wb-input{grid-area:input} #wb-result{grid-area:result} #wb-thread{grid-area:thread} #wb-history{grid-area:history}
  .wb-card{background:var(--wb-panel); border:1px solid var(--wb-line); border-radius:var(--wb-radius);
    box-shadow:var(--wb-shadow-sm); padding:var(--wb-pad)}
  .wb-card h2{font-size:15px; margin:0 0 12px; color:var(--wb-ink); display:flex; align-items:center; gap:8px}
  .wb-card h2::before{content:""; width:4px; height:16px; border-radius:2px; background:var(--wb-brand)}
  .wb-card.accent{background:var(--wb-brand-soft)}
  .wb-card .wb-hint{font-size:12px; color:var(--wb-sub); margin:-6px 0 10px}
  #wb-footer{grid-column:1 / -1; color:var(--wb-muted); font-size:12px; text-align:center; padding:8px}
  #wb-footer .wb-beian{color:inherit; text-decoration:none}
  #wb-footer .wb-beian:hover{text-decoration:underline}
  .wb-mainbtn-row{display:flex; justify-content:flex-end; margin-top:12px}
  .wb-click-fb{display:none; margin:8px 0 0; text-align:right; font-size:12px; color:var(--wb-brand); font-weight:600}
  .wb-warn-note{border:1px solid var(--wb-warn); background:var(--wb-warn-bg); color:var(--wb-warn);
    border-radius:var(--wb-radius-sm); padding:10px 12px; font-size:13px; margin-bottom:12px}
  .wb-modal{position:fixed; inset:0; z-index:100; background:rgba(15,23,42,.45); display:none;
    align-items:center; justify-content:center; padding:20px}
  .wb-modal-card{background:var(--wb-panel); border:1px solid var(--wb-line); border-radius:var(--wb-radius-lg);
    box-shadow:var(--wb-shadow); max-width:440px; width:100%; padding:var(--wb-pad)}
  .wb-modal-title{margin:0 0 10px; font-size:15px; color:var(--wb-ink)}
  .wb-modal-body{font-size:13px; color:var(--wb-sub); line-height:1.7; word-break:break-word}
  .wb-modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
  #bugModal .wb-modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  #bugModal .wb-modal-x{background:transparent; border:0; color:var(--wb-sub); font-size:20px; line-height:1; cursor:pointer; min-width:36px; min-height:36px}
  #bugModal .wb-bug-tip{font-size:12px; color:var(--wb-sub); margin:0 0 8px; line-height:1.6}
  #bugModal .wb-bug-ta{width:100%; box-sizing:border-box; border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm);
    padding:8px 10px; font-family:inherit; font-size:13px; color:var(--wb-ink); background:var(--wb-panel); resize:vertical; min-height:88px}
  #bugModal .wb-bug-ta:focus{outline:0; border-color:var(--wb-brand)}
  #bugModal .wb-bug-lbl{font-size:12px; font-weight:600; color:var(--wb-sub); display:block; margin:10px 0 5px}
  #bugModal .req{color:var(--wb-err)}
  #bugModal .wb-msg{font-size:12px; min-height:16px; margin-top:8px}
  .wb-busy{display:inline-flex; align-items:center; gap:8px}
  .wb-spinner{width:14px; height:14px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff;
    border-radius:50%; animation:wb-spin .7s linear infinite}
  @keyframes wb-spin{to{transform:rotate(360deg)}}

  /* ===== 检索表单 ===== */
  .wb-field{margin-bottom:12px}
  .wb-field label{display:block; font-size:12px; font-weight:600; color:var(--wb-sub); margin-bottom:5px}
  .wb-field input[type=text], .wb-field input[type=number], .wb-field select{
    width:100%; border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm);
    padding:9px 10px; font-family:inherit; font-size:14px; color:var(--wb-ink); background:var(--wb-panel)}
  .wb-field input:focus, .wb-field select:focus{outline:0; border-color:var(--wb-brand)}
  .wb-row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .wb-src-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .wb-src{display:flex; align-items:center; gap:6px; border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm);
    background:var(--wb-panel); padding:6px 8px; cursor:pointer; font-size:13px; color:var(--wb-ink)}
  .wb-src:hover{border-color:var(--wb-brand)}
  .wb-src input{accent-color:var(--wb-brand)}
  .wb-src.off{opacity:.72}
  .wb-src.on{background:var(--wb-brand-soft); border-color:var(--wb-brand); color:var(--wb-brand)}

  /* ===== 结果区 ===== */
  .wb-metrics{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px}
  .wb-metric{background:var(--wb-bg); border:1px solid var(--wb-line-soft); border-radius:var(--wb-radius-sm); padding:10px 12px}
  .wb-metric .k{font-size:11px; color:var(--wb-sub); margin:0}
  .wb-metric .v{font-size:22px; font-weight:700; color:var(--wb-ink); margin:2px 0 0; font-variant-numeric:tabular-nums}
  .wb-land{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--wb-line-soft)}
  .wb-land h3{font-size:12px; color:var(--wb-sub); margin:0 0 8px; font-weight:600}
  .wb-bar{display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12px}
  .wb-bar .nm{width:78px; color:var(--wb-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:0 0 auto}
  .wb-bar .tr{flex:1; height:8px; border-radius:4px; background:var(--wb-bg-2); overflow:hidden}
  .wb-bar .fl{height:8px; border-radius:4px; background:var(--wb-brand)}
  .wb-bar .fl.b2{background:var(--wb-brand-2)}
  .wb-bar .ct{width:34px; text-align:right; color:var(--wb-muted); font-variant-numeric:tabular-nums; flex:0 0 auto}
  .wb-running{display:flex; align-items:center; gap:8px; margin-bottom:12px; padding:10px 12px;
    border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm); background:var(--wb-bg); font-size:13px; color:var(--wb-sub)}
  .wb-dotspin{width:12px; height:12px; border:2px solid var(--wb-brand-soft); border-top-color:var(--wb-brand);
    border-radius:50%; animation:wb-spin .8s linear infinite; flex:0 0 auto}
  .wb-logbox{font-family:var(--wb-mono); font-size:12px; line-height:1.5; background:var(--wb-bg);
    border:1px solid var(--wb-line); border-radius:var(--wb-radius-sm); padding:10px 12px;
    max-height:190px; overflow:auto; white-space:pre-wrap; word-break:break-all; color:var(--wb-sub)}
  .wb-subhead{display:flex; align-items:center; gap:8px; margin:4px 0 10px}
  .wb-subhead h3{font-size:13px; margin:0; color:var(--wb-ink)}
  details.wb-logtoggle summary{cursor:pointer; font-size:12px; color:var(--wb-sub); margin-bottom:6px}
  .wb-empty{border:1px dashed var(--wb-line); border-radius:var(--wb-radius); padding:26px 16px;
    text-align:center; color:var(--wb-muted); font-size:13px; background:var(--wb-panel)}
  .wb-err{border:1px solid var(--wb-err); background:var(--wb-err-bg); color:var(--wb-err);
    border-radius:var(--wb-radius-sm); padding:10px 12px; font-size:13px; margin-bottom:12px}
  .wb-ok-note{border:1px solid var(--wb-ok); background:var(--wb-ok-bg); color:var(--wb-ok);
    border-radius:var(--wb-radius-sm); padding:10px 12px; font-size:13px; margin-bottom:12px}

  @media (max-width:768px){
    .wb-main{grid-template-columns:1fr; grid-template-areas:"input" "result" "thread" "history"}
    .wb-topbar{flex-wrap:wrap}
    .wb-btn,.wb-lang{min-height:44px; font-size:15px}
    input,select,textarea{font-size:16px}
    .wb-row2, .wb-src-grid{grid-template-columns:1fr}
    .wb-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
    .wb-land{grid-template-columns:1fr}
  }
</style>

  function wbSubmitBug(){
    var ta=document.getElementById("bugDesc"); if(!ta) return;
    var desc=ta.value.trim(); var m=document.getElementById("bugMsg"); if(!m) return;
    var s=document.getElementById("bugSubmitBtn");
    if(!desc){ m.textContent=WB_T.bugFill; m.style.color="var(--wb-err)"; return; }
    if(!bugConfirmed){
      var pv=document.getElementById("bugPreview");
      if(pv){ pv.textContent=buildBugPreview(desc); pv.style.display="block"; }
      if(s) s.textContent=WB_T.submitConfirm;
      var b=document.getElementById("bugBackBtn"); if(b) b.style.display="inline-flex";
      m.textContent=WB_T.bugConfirmTip; m.style.color="";

    }
    if(s){ s.disabled=true; s.textContent=WB_T.submitting; }
    fetch(WB_API+"/api/bug-report",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({description:desc, meta:{page:location.href, locale:WB_LANG, task:_currentTask}})})
      .then(function(r){ return r.json(); }).then(function(j){

  /* ===== 表单读取 -> POST /api/search (无后端时自动切离线演示) ===== */
  function wbMainActionImpl(){
    var cond=document.getElementById("wb-f-cond").value.trim();
    var intr=document.getElementById("wb-f-intr").value.trim();

    if(!cond&&!intr&&!sp){ wbModal(WB_T.inputTitle, '<p>'+WB_T.missingCond+'</p>'); return; }
    var srcs=[]; document.querySelectorAll("#wb-srcs input:checked").forEach(function(c){ srcs.push(c.value); });
    if(srcs.indexOf("ctgov")<0) srcs.unshift("ctgov");
    var payload={
      cond:cond, intr:intr, sponsor:sp,
      status:document.getElementById("wb-f-status").value,
      since_years:document.getElementById("wb-f-years").value||"0",
      max:document.getElementById("wb-f-max").value||"50",
      cde_keyword:document.getElementById("wb-f-cdekw").value.trim(),
      registries:srcs
    };
    wbClickAck();
    if(_OFFLINE){ setTimeout(demoSearch, 350); return; }
    wbSetBackend("warn", WB_T.backendBusy);
    renderRunning(true);
    fetch(WB_API+"/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(function(r){ return r.json(); }).then(function(j){
        if(!j.task_id) throw new Error((j.error||"no task id"));
        _currentTask=j.task_id;
        wbClickAck(WB_T.taskGot.replace("{id}", j.task_id), WB_T.backendBusy);
        pollTask(j.task_id);
      }).catch(function(e){
        _OFFLINE=true; wbSetBackend("err", WB_T.backendErr, WB_T.backendErrTip);
        renderRunning(false);
        demoSearch();
      });
  }
  function pollTask(id){
    if(_pollTimer) clearInterval(_pollTimer);
    var tick=function(){
      fetch(WB_API+"/api/task/"+id).then(function(r){ return r.json(); }).then(function(t){
        var log=document.getElementById("wb-log");
        if(log&&t.log){ log.textContent=t.log.slice(-12000); log.scrollTop=log.scrollHeight; }
        if(t.state==="done"||t.state==="error"){ renderDone(id, t); }
        else if(t.state==="unknown"){ _pollTimer=null; }
      }).catch(function(){});
    };
    tick(); _pollTimer=setInterval(tick, 1600);
  }

  function statusClass(st){
    var s=String(st||"").toLowerCase();
    if(/recruit|进行|ongoing|enroll/i.test(s)) return "ok";
    if(/complet|完成|term|终止|suspend|暂停|withdr|撤回|not.?yet|尚未|active/i.test(s)) return "";
    return "";

  function metric(k,v){ return '<div class="wb-metric"><p class="k">'+k+'</p><p class="v">'+v+'</p></div>'; }
  function barsHtml(ph, rg, sp){
    var bar=function(name,list,second){
      var arr=(list||[]).slice(0,5); if(!arr.length) return "";
      var max=Math.max.apply(null, arr.map(function(x){ return x.n||0; }))||1;
      var rows=arr.map(function(x,i){
        var w=Math.round(((x.n||0)/max)*100);
        return '<div class="wb-bar"><span class="nm">'+escapeHtml(String(x.k))+'</span>'+
          '<span class="tr"><span class="fl'+(i%2?' b2':'')+'" style="width:'+Math.max(2,w)+'%"></span></span>'+
          '<span class="ct">'+x.n+'</span></div>';
      }).join("");
      return '<div><h3>'+name+'</h3>'+rows+'</div>';
    };
    var a=bar(WB_T.pPhase, ph), b=bar(WB_T.pRegion, rg), c2=bar(WB_T.pSponsor, sp);
    if(!a&&!b&&!c2) return "";
    return '<div class="wb-land">'+a+b+c2+'</div>';
  }
  function fmt(n){ return (n==null||n==="") ? "-" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  /* ===== 冒烟自检 ===== */
  function wbSmokeCheck(){
    var issues=[];
    ["wb-input","wb-result","wb-thread","wb-history","wb-history-mount","wb-main-btn","wb-backend"].forEach(function(id){
      if(!document.getElementById(id)) issues.push("missing #"+id);
    });
    var z=Object.keys(I18N.zh), e=Object.keys(I18N.en);
    e.forEach(function(k){ if(z.indexOf(k)<0) issues.push("en-only key: "+k); });
    z.forEach(function(k){ if(e.indexOf(k)<0) issues.push("zh-only key: "+k); });
    return issues;
  }

  (async function wbInit(){
    try{ var r=await fetch(WB_API+"/api/config"); if(r.ok) WB_CFG=await r.json(); }catch(_){}
    if(!WB_CFG){ try{ WB_CFG=JSON.parse(document.getElementById("wb-config").textContent); }catch(_){ WB_CFG={}; } }
    var th=(WB_CFG.theme||{});
    document.documentElement.setAttribute("data-brand", th.brand||"clinical-indigo");
    document.documentElement.setAttribute("data-theme", th.mode||"light");
    WB_LANG=wbDetectLang(); WB_T=I18N[WB_LANG];
    document.getElementById("langZh").classList.toggle("on", WB_LANG==="zh");
    document.getElementById("langEn").classList.toggle("on", WB_LANG==="en");
    if(WB_CFG.title&&WB_CFG.title[WB_LANG]) document.getElementById("wb-title").textContent=WB_CFG.title[WB_LANG];
    wbLocalize(); wbRefreshAll();
    var issues=wbSmokeCheck(); if(issues.length) console.warn("[wb-smoke]", issues);
    wbProbeBackend();
    initHistory();
  })();

  /* ===== 运行记录 (WBList) ===== */
  function initHistory(){
    if(!window.WBList) return;
    window.wbHistory=window.WBList.create({
      mount:"wb-history-mount", pageSize:10, selectable:false, rowId:"id",
      columns:[
        {key:"at", label:{zh:WB_T.hAt,en:WB_T.hAt}, sortable:true, searchable:true},
        {key:"cond", label:{zh:WB_T.hCond,en:WB_T.hCond}, searchable:true},
        {key:"src", label:{zh:WB_T.hSrc,en:WB_T.hSrc}, searchable:false},
        {key:"state", label:{zh:WB_T.hState,en:WB_T.hState}, searchable:false,
          render:function(r){ var cls=r.state==="done"?"ok":(r.state==="error"?"err":"warn");
            var txt=r.state==="done"?WB_T.hDone:(r.state==="error"?WB_T.hErr:WB_T.hRun);
            return '<span class="wb-pill '+cls+'"><span class="dot"></span>'+txt+'</span>'; }},
        {key:"excel", label:{zh:WB_T.hReport,en:WB_T.hReport}, searchable:false,
          render:function(r){ return r.excel?'<a href="'+WB_API+'/api/download?task='+r.id+'">xlsx</a>':"·"; }}
      ],
      fetchData: function(){
        return fetch(WB_API+"/api/runs").then(function(r){ return r.json(); }).then(function(j){
          return (j.runs||[]).map(function(m){
            var p=m.params||{};
            var q=[p.cond,p.intr,p.sponsor].filter(function(x){ return x&&String(x).trim(); }).join(" | ")||"-";
            return {id:m.id, at:m.at, cond:q, src:m.sources||"-", state:m.state||"-", excel:!!m.excel};
          });
        }).catch(function(){ return []; });
      },
      onDelete:function(row){
        wbAsk(WB_T.historyTitle, '<p>'+WB_T.delRun+'</p>', function(){
          fetch(WB_API+"/api/run-delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:row.id})})
            .then(function(){ if(window.wbHistory) window.wbHistory.refresh(); }).catch(function(){});
        });
      }
    });
  }
  </script>
  <style id="wb-inline-wblist">
/* =============================================================================
 * ct-base · 列表管理组件样式 (List Management Component)
 * -----------------------------------------------------------------------------
 * 框架级可复用「管理列表」：筛选 + 排序 + 分页 + 行内增删改。

.wb-list{display:flex; flex-direction:column; gap:var(--wb-gap-sm, 12px)}

/* 工具条：检索框 + 排序 + 选中操作 */

.wb-list-search svg{width:16px; height:16px; color:var(--wb-sub); flex:0 0 auto}
.wb-list-search input{border:0; outline:0; background:transparent; flex:1; font-family:inherit; font-size:14px; color:var(--wb-ink); min-height:40px}

.wb-list-table th,.wb-list-table td{padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid var(--wb-line-soft); vertical-align:middle}
.wb-list-table th{background:var(--wb-bg); color:var(--wb-sub); font-weight:600; white-space:nowrap; cursor:default}

/* 行内操作按钮（内联 SVG，禁止 emoji） */
.wb-list-act{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;

/* 卡片行模板布局（决策 C，opt.rowRender 存在时启用）：复用检索/排序/分页，行内渲染卡片 */

/* 窄屏：表格转卡片列表 */

<script id="wb-inline-wblistjs">
/* =============================================================================
 * ct-base · 列表管理组件 (List Management Component) — window.WBList
 * -----------------------------------------------------------------------------
 * 框架级可复用的「管理列表」：筛选 + 排序 + 分页 + 行内增删改。
 * 设计约束（详见 workbench_ui.md §11，遵循工作台铁律 9/10）：
 *   · 单向数据流：load → apply(筛选/排序/分页) → render（唯一渲染入口，禁止渲染函数互调）
 *   · 事件处理只改 state，再调 apply()/render()；不在渲染函数内触发其它渲染函数
 *   · 仅用 --wb-* 令牌（样式在 wb-list.css）；图标全内联 SVG，禁止 emoji
 *   · 双语：读 window.WB_LANG + window.WB_T（键 wbl_*），或 opt.i18nExtra 覆盖
 *
 * 用法：
 *   const list = WBList.create({
 *     mount:"wb-list-mount",
 *     columns:[ {key:"title", label:{zh:"标题",en:"Title"}, searchable:true, sortable:true},
 *               {key:"date",  label:{zh:"日期",en:"Date"},  sortable:true, align:"right"} ],
 *     pageSize:10, selectable:true,
 *     fetchData: async () => [...],        // 业务提供数据；或传 data:[...]
 *     onEdit:(row)=>{...}, onDelete:(row)=>{...}, onSelect:(ids)=>{...}
 *   });
 *   // 卡片行模板（决策 C）：传入 rowRender 则整列表切到「卡片列表」布局（分页/排序/筛选/单条删除均复用）
 *   //   rowRender(row, lang) 返回卡片内部 HTML；选择框与操作按钮由组件自动叠加。
 *   //   WBList.create({ mount, rowRender:(r,l)=>`<article>...</article>`, fetchData, onDelete });
 *   // 不传 rowRender 时仍走原 <table> 表格布局（决策 A）。
 *   // 切语言时重建文案：在技能的 wbOnLangChange 里调 list.rerender()
 * ========================================================================== */
(function () {
  "use strict";

  // 默认文案（可被 I18N.wbl_* 或 opt.i18nExtra 覆盖）
  var DEF_I18N = {
    zh: { wblSearch: "搜索", wblSort: "排序", wblEmpty: "暂无数据", wblPage: "页",
          wblPrev: "上一页", wblNext: "下一页", wblSelected: "已选", wblConfirmDel: "确认删除该项？",
          wblActions: "操作", wblItems: "条" },
    en: { wblSearch: "Search", wblSort: "Sort", wblEmpty: "No data", wblPage: "page",
          wblPrev: "Prev", wblNext: "Next", wblSelected: "Selected", wblConfirmDel: "Delete this item?",
          wblActions: "Actions", wblItems: "items" }
  };

  function t(opt, key) {
    var l = window.WB_LANG || "zh";
    if (opt.i18nExtra && opt.i18nExtra[key] != null) return opt.i18nExtra[key];
    if (window.WB_T && window.WB_T["wbl_" + key] != null) return window.WB_T["wbl_" + key];
    return (DEF_I18N[l] || DEF_I18N.zh)[key];
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // 内联 SVG 图标（禁止 emoji）
  var ICON = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    edit:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    del:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>'
  };

  var WBList = {
    /** 创建列表控制器，返回 { refresh, rerender, getSelected } */
    create: function (opt) {
      var mount = document.getElementById(opt.mount);
      if (!mount) { console.warn("[WBList] 缺失挂载点 #" + opt.mount); return null; }

      var pageSize = opt.pageSize || 10;
      var columns = opt.columns || [];
      var selectable = !!opt.selectable;
      var rowId = opt.rowId || "id";
      var searchableKeys = opt.searchableKeys ||
        columns.filter(function (c) { return c.searchable; }).map(function (c) { return c.key; });

      var state = { all: [], filtered: [], page: 1, sortKey: null, sortDir: 1, q: "", selected: {}, _keepSearchFocus: false };

      function hasActions() { return !!(opt.onEdit || opt.onDelete); }
      function ridOf(r) { return opt.rowId ? r[rowId] : state.all.indexOf(r); }

      // ---------- 数据层 ----------
      function load() {
        var src = opt.fetchData ? opt.fetchData() : (opt.data || []);
        Promise.resolve(src).then(function (rows) {
          state.all = rows || [];
          state.page = 1;
          apply();                       // 单向：load → apply → render
        }).catch(function (e) {
          console.error("[WBList] fetchData 失败", e); state.all = []; apply();
        });
      }

      // ---------- 计算层：筛选 + 排序 + 分页切片 ----------
      function apply() {
        var rows = state.all;
        var q = (state.q || "").trim().toLowerCase();
        if (q && searchableKeys.length) {
          rows = rows.filter(function (r) {
            return searchableKeys.some(function (k) { return String(r[k] == null ? "" : r[k]).toLowerCase().indexOf(q) >= 0; });
          });
        }
        if (state.sortKey) {
          var col = columns.filter(function (c) { return c.key === state.sortKey; })[0];
          var dir = state.sortDir;
          rows = rows.slice().sort(function (a, b) {
            var av = col && col.sortValue ? col.sortValue(a) : a[state.sortKey];
            var bv = col && col.sortValue ? col.sortValue(b) : b[state.sortKey];
            if (av == null) av = ""; if (bv == null) bv = "";
            if (typeof av === "number" && typeof bv === "number") return (av - bv) * dir;
            return String(av).localeCompare(String(bv), "zh-Hans-CN") * dir;
          });
        }
        state.filtered = rows;
        render();                        // 唯一渲染入口
      }

      // ---------- 渲染层（只读 state，禁止互调其它渲染函数） ----------
      function render() {
        var l = window.WB_LANG || "zh";
        var total = state.filtered.length;
        var totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (state.page > totalPages) state.page = totalPages;
        var start = (state.page - 1) * pageSize;
        var pageRows = state.filtered.slice(start, start + pageSize);

        var headHtml = columns.map(function (c) {
          var label = (c.label && (c.label[l] || c.label.zh)) || c.key;
          var arrow = (state.sortKey === c.key) ? '<span class="arrow">' + (state.sortDir > 0 ? "▲" : "▼") + "</span>" : "";
          return '<th class="' + (c.align === "right" ? "wb-num " : "") + (c.sortable ? "sortable" : "") + '"' +
            (c.sortable ? ' data-sort="' + esc(c.key) + '"' : "") + ">" + esc(label) + arrow + "</th>";
        }).join("") +
          (selectable ? "<th></th>" : "") +
          (hasActions() ? '<th class="actions">' + esc(t(opt, "wblActions")) + "</th>" : "");

        var bodyHtml = pageRows.map(function (r) {
          var rid = ridOf(r);
          var cells = columns.map(function (c) {
            var v = c.render ? c.render(r, l) : esc(r[c.key]);
            return '<td class="' + (c.align === "right" ? "wb-num " : "") + '" data-label="' + esc((c.label && (c.label[l] || c.label.zh)) || c.key) + '">' + v + "</td>";
          }).join("");
          var sel = selectable ? '<td><input type="checkbox" class="wb-list-sel" data-rid="' + esc(rid) + '"' + (state.selected[rid] ? " checked" : "") + "></td>" : "";
          var acts = hasActions() ? '<td class="actions">' + actionsHtml(rid) + "</td>" : "";
          return '<tr class="' + (state.selected[rid] ? "sel" : "") + '" data-rid="' + esc(rid) + '">' + cells + sel + acts + "</tr>";
        }).join("");

        var barHtml =
          '<div class="wb-list-bar">' +
            '<label class="wb-list-search">' + ICON.search +
              '<input type="search" id="wbl-search" placeholder="' + esc(t(opt, "wblSearch")) + '" value="' + esc(state.q) + '"></label>' +
            sortSelectHtml(l) +
            (selectable ? '<span class="wb-list-count">' + esc(t(opt, "wblSelected")) + ': <b id="wbl-selcount">' + Object.keys(state.selected).length + "</b></span>" : "") +
            '<span class="wb-list-count">' + total + " " + esc(t(opt, "wblItems")) + "</span>" +
          "</div>";

        var listHtml;
        if (opt.rowRender && pageRows.length) {
          listHtml = renderCards(pageRows, l);          // 决策 C：卡片列表布局
        } else if (total === 0) {
          listHtml = '<div class="wb-list-empty">' + esc(t(opt, "wblEmpty")) + "</div>";
        } else {
          listHtml = '<table class="wb-list-table"><thead><tr>' + headHtml + "</tr></thead><tbody>" + bodyHtml + "</tbody></table>";
        }

        mount.innerHTML = '<div class="wb-list">' + barHtml + listHtml + pagerHtml(totalPages, total) + "</div>";

        bind();
        if (state._keepSearchFocus) {                 // 检索输入重建后保持焦点与光标
          var inp = document.getElementById("wbl-search");
          if (inp) { inp.focus(); var v = inp.value; inp.value = ""; inp.value = v; }
          state._keepSearchFocus = false;
        }
      }

      function actionsHtml(rid) {
        var h = "";
        if (opt.onEdit) h += '<button class="wb-list-act" data-act="edit" data-rid="' + esc(rid) + '" title="edit">' + ICON.edit + "</button>";
        if (opt.onDelete) h += '<button class="wb-list-act danger" data-act="del" data-rid="' + esc(rid) + '" title="delete">' + ICON.del + "</button>";
        return h;
      }
      function sortSelectHtml(l) {
        if (!columns.some(function (c) { return c.sortable; })) return "";
        var opts = '<option value="">' + esc(t(opt, "wblSort")) + "</option>" +
          columns.filter(function (c) { return c.sortable; }).map(function (c) {
            var label = (c.label && (c.label[l] || c.label.zh)) || c.key;
            var v = c.key;
            var sel = state.sortKey === v ? " selected" : "";
            return '<option value="' + esc(v) + '"' + sel + ">" + esc(label) + "</option>";
          }).join("");
        return '<select class="wb-list-sort" id="wbl-sort">' + opts + "</select>";
      }
      // 卡片行模板模式（决策 C）：rowRender 返回卡片内部 HTML，选择框/操作按钮由组件叠加
      function renderCards(pageRows, l) {
        var cards = pageRows.map(function (r) {
          var rid = ridOf(r);
          var inner = opt.rowRender ? opt.rowRender(r, l) : "";
          var sel = selectable ? '<label class="wb-list-selwrap"><input type="checkbox" class="wb-list-sel" data-rid="' + esc(rid) + '"' + (state.selected[rid] ? " checked" : "") + "></label>" : "";
          var acts = hasActions() ? '<div class="wb-list-cardacts">' + actionsHtml(rid) + "</div>" : "";
          return '<article class="wb-list-rowcard' + (state.selected[rid] ? " sel" : "") + '" data-rid="' + esc(rid) + '">' + sel +
            '<div class="wb-list-cardbody">' + inner + "</div>" + acts + "</article>";
        }).join("");
        return '<div class="wb-list-cards">' + cards + "</div>";
      }
      function pagerHtml(totalPages, total) {
        if (total === 0) return "";
        var p = state.page;
        var prev = '<button class="wb-list-pagebtn" data-page="prev"' + (p <= 1 ? " disabled" : "") + ">" + esc(t(opt, "wblPrev")) + "</button>";
        var next = '<button class="wb-list-pagebtn" data-page="next"' + (p >= totalPages ? " disabled" : "") + ">" + esc(t(opt, "wblNext")) + "</button>";
        var nums = "";
        var lo = Math.max(1, p - 2), hi = Math.min(totalPages, p + 2);
        for (var i = lo; i <= hi; i++) {
          nums += '<button class="wb-list-pagebtn' + (i === p ? " cur" : "") + '" data-page="' + i + '">' + i + "</button>";
        }
        return '<div class="wb-list-foot"><div class="wb-list-pager">' + prev + nums + next +
          '</div><span class="wb-list-info">' + p + " / " + totalPages + " " + esc(t(opt, "wblPage")) + "</span></div>";
      }

      // ---------- 事件绑定（每次 render 后执行；铁律 10.6） ----------
      function bind() {
        var search = document.getElementById("wbl-search");
        if (search) search.addEventListener("input", function () {
          state._keepSearchFocus = true; state.q = search.value; apply();
        });
        var sort = document.getElementById("wbl-sort");
        if (sort) sort.addEventListener("change", function () {
          state.sortKey = sort.value || null; state.sortDir = 1; state.page = 1; apply();
        });
        mount.querySelectorAll("th.sortable").forEach(function (th) {
          th.addEventListener("click", function () {
            var k = th.getAttribute("data-sort");
            if (state.sortKey === k) state.sortDir = -state.sortDir; else { state.sortKey = k; state.sortDir = 1; }
            state.page = 1; apply();
          });
        });
        mount.querySelectorAll(".wb-list-pagebtn").forEach(function (b) {
          b.addEventListener("click", function () {
            var v = b.getAttribute("data-page");
            if (v === "prev") state.page = Math.max(1, state.page - 1);
            else if (v === "next") state.page = Math.min(Math.ceil(state.filtered.length / pageSize), state.page + 1);
            else state.page = parseInt(v, 10);
            render();
          });
        });
        mount.querySelectorAll(".wb-list-act").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var rid = btn.getAttribute("data-rid");
            var row = rowByRid(rid);
            if (btn.getAttribute("data-act") === "edit" && opt.onEdit) opt.onEdit(row);
            if (btn.getAttribute("data-act") === "del") {
              if (window.confirm(t(opt, "wblConfirmDel")) && opt.onDelete) opt.onDelete(row);
            }
          });
        });
        if (selectable) mount.querySelectorAll(".wb-list-sel").forEach(function (cb) {
          cb.addEventListener("change", function () {
            var rid = cb.getAttribute("data-rid");
            if (cb.checked) state.selected[rid] = true; else delete state.selected[rid];
            var cnt = document.getElementById("wbl-selcount");
            if (cnt) cnt.textContent = Object.keys(state.selected).length;
            if (opt.onSelect) opt.onSelect(Object.keys(state.selected));
          });
        });
      }
      function rowByRid(rid) {
        if (opt.rowId) return state.all.filter(function (r) { return String(r[rowId]) === String(rid); })[0];
        return state.all[parseInt(rid, 10)];
      }

      // 立即加载并首渲染
      load();

      return {
        refresh: load,                 // 重新拉数据
        rerender: render,              // 仅重建文案（如切语言），不重新拉数据
        getSelected: function () { return Object.keys(state.selected); }
      };
    }
  };

  window.WBList = WBList;
})();

</script>
</body>
</html>
